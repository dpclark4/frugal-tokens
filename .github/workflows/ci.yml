name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t files < <(
            git diff --diff-filter=ACMR --name-only "$BASE_SHA"...HEAD -- \
              'src/**' 'scripts/**' 'e2e/**' 'deno.json' 'package.json' \
              'tsconfig.json' 'vite.config.ts' 'vitest.config.ts' \
              'railpack.json' 'railway.json' 'index.html'
          )
          if (( ${#files[@]} == 0 )); then
            echo "No Deno-formatted files changed."
          else
            deno fmt --check "${files[@]}"
          fi

      - name: Run Oxlint
        run: pnpm lint

      - name: Run anti-slop gate
        run: pnpm lint:oxlint:gate

      - name: Run type check
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Run HTTP e2e tests
        run: pnpm test:e2e

      - name: Build application
        run: pnpm build
