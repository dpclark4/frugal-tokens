[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "deno-fmt",
    name = "deno fmt",
    language = "system",
    entry = "deno fmt --check",
    files = "\\.(ts|tsx|json)$",
    exclude = "^(\\.agents/|tools/oxlint/anti-slop/|tools/pi-cache-telemetry/)",
  },
  {
    id = "deno-lint",
    name = "deno lint",
    language = "system",
    entry = "deno lint",
    files = "\\.(ts|tsx)$",
    exclude = "^(\\.agents/|tools/oxlint/anti-slop/)",
  },
  {
    id = "anti-slop-gate",
    name = "anti-slop gate",
    language = "system",
    entry = "deno task lint:oxlint:gate",
    pass_filenames = false,
    files = "\\.(js|jsx|mjs|cjs|ts|tsx|json)$",
    exclude = "^(\\.agents/|tools/oxlint/anti-slop/)",
  },
  {
    id = "deno-check",
    name = "deno check",
    language = "system",
    entry = "deno task check",
    pass_filenames = false,
    files = "\\.(ts|tsx)$",
  },
]
